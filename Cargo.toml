[workspace]
resolver = "2"
members = [
    "crates/hiquant-core",
    "crates/hiquant-protocol",
    "crates/hiquant-data",
    "crates/hiquant-storage",
    "crates/hiquant-account",
    "crates/hiquant-market",
    "crates/hiquant-engine",
    "crates/hiquant-broker",
    "crates/hiquant-server",
    "crates/hiquant-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["hiquant-rs contributors"]
license = "MIT"
repository = "https://github.com/HowLi0/hiquant"

[workspace.dependencies]
# 内部 crate
hiquant-core = { path = "crates/hiquant-core" }
hiquant-protocol = { path = "crates/hiquant-protocol" }
hiquant-data = { path = "crates/hiquant-data" }
hiquant-storage = { path = "crates/hiquant-storage" }
hiquant-account = { path = "crates/hiquant-account" }
hiquant-market = { path = "crates/hiquant-market" }
hiquant-engine = { path = "crates/hiquant-engine" }
hiquant-broker = { path = "crates/hiquant-broker" }
hiquant-server = { path = "crates/hiquant-server" }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 异步运行时
tokio = { version = "1", features = ["full"] }

# 时间日期
chrono = { version = "0.4", features = ["serde"] }

# 错误处理
thiserror = "1"
anyhow = "1"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 唯一 ID
uuid = { version = "1", features = ["v4", "serde"] }

# 数据库
rusqlite = { version = "0.31", features = ["bundled"] }

# Web
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
tokio-tungstenite = "0.21"

# HTTP 客户端（数据源下载）
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# 异步 trait
async-trait = "0.1"

# CSV
csv = "1.3"

# CLI
clap = { version = "4", features = ["derive"] }

# 并发容器
dashmap = "5"
parking_lot = "0.12"

# 随机数（示例数据生成）
rand = "0.8"

# 数值
rust_decimal = { version = "1", features = ["serde-with-float"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
